[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiovir"
version = "0.1.0"
description = "Async Python client for Virasty social platform"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Kheybar"},
    {name = "Amirali"},
    {name = "Saman Rezaei"},
]
keywords = ["virasty", "aiovir", "virasty-bot", "social-media", "async", "bot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.8"
dependencies = [
    "aiohttp>=3.8.0",
    "cryptography>=41.0.0",
    "msgpack>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/karbaladevir/aiovir"
Documentation = "https://karbaladevir.github.io/aiovir-docs/"
Repository = "https://github.com/karbaladevir/aiovir"
Issues = "https://github.com/karbaladevir/aiovir/issues"
License = "https://github.com/karbaladevir/aiovir/blob/main/LICENSE"

[project.optional-dependencies]
proxy = ["aiohttp-socks>=0.8.0"]